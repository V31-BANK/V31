# Integration tests run against a real Valkey on database 15, which is the one
# nothing else uses, under a prefix of their own. The behaviour under test is
# sorted-set pagination and an atomic claim: neither exists in a fake.
spring:
  application:
    name: V31-cbs-service-it
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: localhost
      port: 6379
      database: 15
      timeout: 2s

v31:
  data:
    valkey:
      key-prefix: v31it

logging:
  level:
    org.v31bank: INFO
