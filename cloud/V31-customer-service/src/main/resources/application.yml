spring:
  application:
    name: V31-customer-service
  jackson:
    # ApiResponse leaves the members it is not using unset: without this a failure
    # carries an empty payload and a success carries empty error fields.
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: wangxiang
    password: ""
  flyway:
    # Every service shares one database, so each one owns a schema. Without this
    # they would share `public` and its single flyway_schema_history, and each
    # would refuse to start on finding migrations it does not have locally.
    #
    # This service was here first and its tables were created in `public`. Moving
    # them into this schema is a one-off operation, not a migration — Flyway
    # cannot record a change to where its own history lives. See
    # db/migration/README.md.
    schemas: customer
    default-schema: customer
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: customer
        format_sql: true
        highlight_sql: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100

server:
  port: 8081

logging:
  level:
    org.v31bank: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.SQL_SLOW: INFO
    org.hibernate.orm.jdbc.bind: TRACE
