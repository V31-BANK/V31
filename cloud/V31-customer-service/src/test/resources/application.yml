# Integration tests run against a real PostgreSQL, because that is what the
# service runs against: an in-memory substitute would not have the constraints,
# the timestamptz columns or the Flyway history that the behaviour under test
# depends on.
#
# The schema is this service's own with an `_it` suffix, so a test run cannot
# disturb development data sitting in the ordinary one. Override the datasource
# on a build agent; nothing else needs to change.
spring:
  application:
    name: V31-customer-service-it
  jackson:
    default-property-inclusion: non_null
  datasource:
    hikari:
      # An integration test drives one request at a time, so a pool sized for
      # production concurrency only competes with the other services' contexts
      # for the server's connection limit — which is how the suite ran out of
      # them once there was more than one context per service.
      maximum-pool-size: 2
    url: jdbc:postgresql://localhost:5432/postgres
    username: wangxiang
    password: ""
  flyway:
    schemas: customer_it
    default-schema: customer_it
    create-schemas: true
    clean-disabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: customer_it

logging:
  level:
    org.v31bank: INFO
    org.hibernate.SQL: WARN
