spring:
  application:
    name: V31-ledger-service
  jackson:
    # ApiResponse leaves the members it is not using unset: without this a failure
    # carries an empty payload and a success carries empty error fields.
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: wangxiang
    password: ""
  flyway:
    # Every service shares one database, so each one owns a schema. Without this
    # they would share `public` and its single flyway_schema_history, and each
    # would refuse to start on finding migrations it does not have locally.
    schemas: ledger
    default-schema: ledger
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ledger
        format_sql: true
        highlight_sql: true

  grpc:
    server:
      # Its own port. The REST port stays what it was: a service can speak both,
      # and putting gRPC on the servlet container would tie the two together.
      port: 9084

server:
  port: 8084

logging:
  level:
    org.v31bank: DEBUG
    org.hibernate.SQL: DEBUG
