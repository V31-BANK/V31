plugins {
	id "java-gradle-plugin"
	id "io.spring.javaformat" version "${javaFormatVersion}"
}

dependencies {
	// Not used to compile anything here — JavaConventions applies it by id. Declared
	// so that it lands on this build's runtime classpath, which is what the main
	// build's scripts are compiled and run against; without it the conventions
	// plugin fails with "Plugin with id 'io.spring.javaformat' not found".
	runtimeOnly("io.spring.javaformat:spring-javaformat-gradle-plugin:${javaFormatVersion}")

	testImplementation(platform("org.junit:junit-bom:${junitJupiterVersion}"))
	testImplementation("org.assertj:assertj-core:${assertjVersion}")
	testImplementation("org.junit.jupiter:junit-jupiter")
	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
	useJUnitPlatform()
}

gradlePlugin {
	plugins {
		conventionsPlugin {
			id = "org.v31bank.conventions"
			implementationClass = "org.v31bank.build.ConventionsPlugin"
		}
	}
}

jar.dependsOn check
