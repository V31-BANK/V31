spring:
  application:
    name: V31-cbs-service
  jackson:
    # ApiResponse leaves the members it is not using unset: without this a failure
    # carries an empty payload and a success carries empty error fields.
    default-property-inclusion: non_null
  data:
    redis:
      host: localhost
      port: 6379
      # Valkey speaks the same protocol, so the Redis client configuration is the
      # Valkey configuration. A command that hangs must not hold the request
      # thread indefinitely.
      timeout: 2s
      connect-timeout: 2s

v31:
  data:
    valkey:
      # Everything this service writes lives under v31:cbs:*, leaving the rest of
      # the keyspace to the other services sharing the instance.
      key-prefix: v31

server:
  port: 8087

logging:
  level:
    org.v31bank: DEBUG
