spring:
  application:
    name: V31-notification-service
  jackson:
    # ApiResponse leaves the members it is not using unset: without this a failure
    # carries an empty payload and a success carries empty error fields.
    default-property-inclusion: non_null
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: wangxiang
    password: ""
  flyway:
    # Every service shares one database, so each one owns a schema. Without this
    # they would share `public` and its single flyway_schema_history, and each
    # would refuse to start on finding migrations it does not have locally.
    schemas: notification
    default-schema: notification
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: notification
        format_sql: true
        highlight_sql: true

  grpc:
    client:
      channel:
        # Where the ledger lives is a deployment concern, not a code one: this is
        # a host here and a service name in a cluster, and nothing compiled
        # changes.
        ledger:
          target: static://localhost:9084

server:
  port: 8088

logging:
  level:
    org.v31bank: DEBUG
    org.hibernate.SQL: DEBUG
