spring:
  application:
    name: V31-customer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: wangxiang
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 100

server:
  port: 8081

logging:
  level:
    org.v31bank: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.SQL_SLOW: INFO
    org.hibernate.orm.jdbc.bind: TRACE
