syntax = "proto3";

package v31.ledger.v1;

import "google/protobuf/timestamp.proto";

option java_package = "org.v31bank.ledger.api.v1";

// The chart of accounts, as other services see it.
//
// This file is the contract. A field is never renumbered and never reused: a
// caller compiled against an older copy reads by number, so changing what a
// number means silently corrupts data rather than failing to compile. Removing
// one means reserving it.
service LedgerAccountService {

  rpc CreateLedgerAccount(CreateLedgerAccountRequest) returns (CreateLedgerAccountResponse);

  rpc GetLedgerAccount(GetLedgerAccountRequest) returns (GetLedgerAccountResponse);

  // Returns one page, newest first.
  rpc ListLedgerAccounts(ListLedgerAccountsRequest) returns (ListLedgerAccountsResponse);

  rpc UpdateLedgerAccount(UpdateLedgerAccountRequest) returns (UpdateLedgerAccountResponse);

  // Returns the account that was removed.
  rpc DeleteLedgerAccount(DeleteLedgerAccountRequest) returns (DeleteLedgerAccountResponse);
}

// Which side of the balance sheet an account belongs to.
enum LedgerAccountType {
  // Never sent. Proto3 gives every enum a zero value, and leaving it unnamed
  // would make "not set" indistinguishable from the first real member.
  LEDGER_ACCOUNT_TYPE_UNSPECIFIED = 0;
  LEDGER_ACCOUNT_TYPE_ASSET = 1;
  LEDGER_ACCOUNT_TYPE_LIABILITY = 2;
  LEDGER_ACCOUNT_TYPE_EQUITY = 3;
  LEDGER_ACCOUNT_TYPE_REVENUE = 4;
  LEDGER_ACCOUNT_TYPE_EXPENSE = 5;
}

// Whether an account is still posted to.
enum LedgerAccountStatus {
  LEDGER_ACCOUNT_STATUS_UNSPECIFIED = 0;
  LEDGER_ACCOUNT_STATUS_ACTIVE = 1;
  LEDGER_ACCOUNT_STATUS_CLOSED = 2;
}

// An account in the chart of accounts.
message LedgerAccount {
  // Time-ordered UUIDv7, as text.
  string id = 1;
  string code = 2;
  string name = 3;
  LedgerAccountType type = 4;
  LedgerAccountStatus status = 5;
  google.protobuf.Timestamp created_date = 6;
  google.protobuf.Timestamp last_modified_date = 7;
}

message CreateLedgerAccountRequest {
  string code = 1;
  string name = 2;
  LedgerAccountType type = 3;
}

message GetLedgerAccountRequest {
  string id = 1;
}

// One message per RPC rather than the account itself, so that an answer can grow a
// field later without every caller having to be told the shape changed.
message CreateLedgerAccountResponse {
  LedgerAccount ledger_account = 1;
}

message GetLedgerAccountResponse {
  LedgerAccount ledger_account = 1;
}

message UpdateLedgerAccountResponse {
  LedgerAccount ledger_account = 1;
}

// Carries the account that was removed.
message DeleteLedgerAccountResponse {
  LedgerAccount ledger_account = 1;
}

message UpdateLedgerAccountRequest {
  string id = 1;
  string code = 2;
  string name = 3;
  LedgerAccountType type = 4;
  // Leave unspecified to keep the current status.
  LedgerAccountStatus status = 5;
}

message DeleteLedgerAccountRequest {
  string id = 1;
}

message ListLedgerAccountsRequest {
  // One-based, to match the rest of the platform. Zero means the first page.
  int32 page_number = 1;
  // Zero means the server's default; anything above its maximum is clamped.
  int32 page_size = 2;
  // Fragment matched against the code, case-insensitive. Empty means no filter.
  string code = 3;
  // Unspecified means no filter.
  LedgerAccountType type = 4;
  LedgerAccountStatus status = 5;
}

// Mirrors the shape the REST layer returns, so a caller reading both sees the
// same pagination.
message ListLedgerAccountsResponse {
  repeated LedgerAccount records = 1;
  int64 total = 2;
  int32 page_number = 3;
  int32 page_size = 4;
  int32 total_pages = 5;
  bool has_next = 6;
}
